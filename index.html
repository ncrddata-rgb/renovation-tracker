<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-build" content="20261125162535">
</head>
<body>
<title>House Renovation App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a site register. Sticky top bar with tabs, single content column up to 1180px, cards only for tiles and dialogs. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --sunken: #eceeea;
  --line: #d9ddd6;
  --fg: #1d2420;
  --muted: #5f6a63;
  --accent: #1f5c7a;
  --accent-soft: #dbe8ef;
  --planned: #6b7280;
  --planned-soft: #eceef1;
  --progress: #1d6fb8;
  --progress-soft: #dcebf8;
  --hold: #a86208;
  --hold-soft: #fbeed9;
  --done: #2f7d3b;
  --done-soft: #def0e0;
  --late: #b42318;
  --late-soft: #fbe3e0;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 24px rgba(20,30,25,.06);
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --surface: #1b201d; --sunken: #232925; --line: #333b36; --fg: #e6ebe7; --muted: #9aa59e;
    --accent: #7cb6d4; --accent-soft: #1d3441;
    --planned: #a3aab4; --planned-soft: #2a2e33; --progress: #6fb0ea; --progress-soft: #17314a;
    --hold: #e3a24a; --hold-soft: #3a2a12; --done: #74c483; --done-soft: #183320; --late: #f07a6c; --late-soft: #3d1a16;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --surface: #1b201d; --sunken: #232925; --line: #333b36; --fg: #e6ebe7; --muted: #9aa59e;
  --accent: #7cb6d4; --accent-soft: #1d3441;
  --planned: #a3aab4; --planned-soft: #2a2e33; --progress: #6fb0ea; --progress-soft: #17314a;
  --hold: #e3a24a; --hold-soft: #3a2a12; --done: #74c483; --done-soft: #183320; --late: #f07a6c; --late-soft: #3d1a16;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 17px; }
.brand span { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.who { display: flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 760px) {
  .tabs { order: 3; width: 100%; padding-bottom: 8px; }
  .who .name { display: none; }
}
.banner { background: var(--hold-soft); color: var(--fg); border-bottom: 1px solid var(--line); font-size: 13px; }
.banner .wrap { padding-block: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

main { padding-block: 24px 64px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.section-head h1 { font-size: 26px; }
.section-head p { margin: 4px 0 0; color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--late); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-planned { color: var(--planned); background: var(--planned-soft); }
.s-progress { color: var(--progress); background: var(--progress-soft); }
.s-hold { color: var(--hold); background: var(--hold-soft); }
.s-done { color: var(--done); background: var(--done-soft); }
.s-late { color: var(--late); background: var(--late-soft); }
select.status-select { border: 0; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 600; appearance: none; -webkit-appearance: none; text-align: center; }

.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; }
button.kpi:hover { border-color: var(--muted); }
.kpi .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi .value { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 4px; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi.countdown { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.kpi.countdown .label, .kpi.countdown .sub { color: inherit; opacity: .85; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.grid2 > * { min-width: 0; }
.panel h2 { font-size: 17px; margin-bottom: 10px; }
.list { border-top: 1px solid var(--line); }
.list-row { display: flex; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.list-row:hover { background: var(--sunken); }
.list-row .t { flex: 1; min-width: 0; }
.list-row .t b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 16px 2px; color: var(--muted); }
.aspect-prog { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.aspect-prog:hover { background: var(--sunken); }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); }
.stack i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.money { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 8px; }
.money div b, .money-tile b { display: block; font-family: var(--font-display); font-size: 20px; }
.dsec-head, .group-head { --head-tint: var(--sunken); --head-tint: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.dsec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; padding: 7px 8px 7px 12px; background: var(--head-tint); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; min-height: 40px; }
.dsec-head h2, .group-head h2 { font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--fg); margin: 0; }
.dsec-head h2 select { font-size: 14px; font-weight: 600; }
.hide-btn { color: var(--accent); flex: none; font-weight: 500; }
.panel > .dsec-head:first-child { margin-top: 0; }
.dsec-body[hidden] { display: none; }
.rp-controls .seg .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.rp-title { margin: 4px 0 14px; } .rp-title h2 { font-size: 20px; } .rp-title p { margin: 2px 0 0; }
.rp-kpis .kpi .value { font-size: 26px; }
.rp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; align-items: start; margin-bottom: 16px; }
.rp-sec { margin-bottom: 16px; }
.rp-grid .rp-sec { margin-bottom: 0; }
.rp-note { margin: -4px 0 6px 2px; padding: 6px 10px; background: var(--sunken); border-radius: 6px; color: var(--muted); }
.rp-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
.rp-days > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rp-bar { height: 70px; width: 22px; background: var(--sunken); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.rp-bar i { display: block; width: 100%; background: var(--done); }
@media print {
  .topbar, .banner, .no-print, .hide-btn, #toast { display: none !important; }
  body { background: #fff !important; }
  .panel, .kpi { break-inside: avoid; box-shadow: none !important; }
  .rp-grid { display: block; } .rp-grid .rp-sec { margin-bottom: 12px; }
  .dsec-body[hidden] { display: block !important; }
}

.money-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font: inherit; color: inherit; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.money-tile:hover { border-color: var(--accent); }
.money-tile .go { color: var(--accent); font-weight: 500; }
.money-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.money-sum > div { background: var(--sunken); border-radius: 10px; padding: 10px 12px; }
.money-sum b { display: block; font-family: var(--font-display); font-size: 20px; }

/* filters + items */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.field, .filters input, .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.filters select { max-width: 100%; }
.chk { display: inline-flex; gap: 6px; align-items: center; }
.group { margin-bottom: 20px; }
.group-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--head-tint); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; }
.group-head .bar { flex: 0 0 90px; }
@media (max-width: 560px) { .group-head { flex-wrap: wrap; row-gap: 4px; } .group-head h2 { flex: 1 0 100%; } }
.item-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px 150px 130px 90px; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.item-row:hover { background: var(--sunken); }
.item-row .title { cursor: pointer; min-width: 0; }
.item-row .title b { font-weight: 500; }
.upd-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 14px; max-width: calc(100% - 32px); }
.ithumb { width: 44px; height: 44px; object-fit: cover; object-position: center; border-radius: 8px; border: 1px solid var(--line); flex: 0 0 auto; display: block; background: var(--sunken); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.ithumb.none { border-color: transparent; background: transparent; box-shadow: none; }
.ithumb.tiny { width: 22px; height: 22px; border-radius: 5px; box-shadow: none; }
.item-row .c-thumb { display: flex; justify-content: flex-start; cursor: pointer; }
.card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.tl-name { display: flex; align-items: center; gap: 8px; }
.tl-name .tl-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item-row .meta { font-size: 12px; color: var(--muted); }
tr.is-off td { color: var(--muted); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 8px 0 0 8px; }
.seg .btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.seg .btn[aria-pressed="true"][data-access="on"] { background: var(--done-soft); color: var(--done); border-color: var(--done); font-weight: 600; }
.seg .btn[aria-pressed="true"][data-access="off"] { background: var(--late-soft); color: var(--late); border-color: var(--late); font-weight: 600; position: relative; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); margin-right: 4px; }
@media (max-width: 760px) {
  .item-row { grid-template-columns: 110px minmax(0, 1fr); }
  .item-row .c-contact, .item-row .c-dates, .item-row .c-prog { grid-column: 2; }
  .item-row .c-thumb { grid-column: 1; grid-row: span 2; justify-content: flex-start; align-self: start; }
  .item-row .c-thumb:has(.none) { display: none; }
  .item-row .c-contact, .item-row .c-dates { font-size: 12px; }
}

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: 12px; padding: 10px; min-height: 200px; }
.col.drop { outline: 2px dashed var(--accent); }
.col h2 { font-size: 14px; display: flex; justify-content: space-between; margin: 2px 4px 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: grab; }
.card b { font-weight: 500; display: block; }
.card .meta { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }

/* timeline */
.tl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tl { position: relative; min-width: 760px; }
.tl-row { display: grid; grid-template-columns: 240px 1fr; border-bottom: 1px solid var(--line); min-height: 30px; align-items: center; }
.tl-row.head { position: sticky; top: 0; background: var(--surface); z-index: 2; font-size: 11.5px; color: var(--muted); }
.tl-row.grp { background: var(--sunken); font-weight: 600; font-family: var(--font-display); }
.tl-name { padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tl-track { position: relative; height: 30px; }
.tl-bar { position: absolute; top: 8px; height: 14px; border-radius: 7px; cursor: pointer; }
.tl-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--late); z-index: 1; pointer-events: none; }
.tl-line.today { border-left: 2px solid var(--accent); }
.tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tl-tick span { position: absolute; top: 6px; left: 4px; white-space: nowrap; }

/* tables (aspects, team) */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* dialog */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
dialog.drawer { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(420px, 100vw); max-width: 100vw; border-radius: 14px 0 0 14px; display: none; flex-direction: column; }
dialog.drawer[open] { display: flex; }
.drawer .sh-sec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer .sh-sec h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.drawer .sh-list { flex: 1; overflow: auto; }
.sh-invite { display: flex; gap: 8px; flex-wrap: wrap; }
.sh-invite .field { flex: 1 1 180px; min-width: 0; }
.sh-person { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.sh-person .who-txt { flex: 1; min-width: 0; }
.sh-person .who-txt div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-person select { width: auto; padding: 4px 6px; font-size: 12.5px; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 6px; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--accent-soft); color: var(--fg); }
.icon-btn.sure { color: var(--late); background: var(--late-soft); font-size: 12px; font-weight: 600; }
.sh-actions, .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.inv-grid .btn { justify-content: center; padding: 12px; }
dialog:has(.invite-menu) { width: min(420px, calc(100vw - 24px)); }
.sh-actions .btn { justify-content: center; white-space: nowrap; padding-left: 6px; padding-right: 6px; }
a.btn { color: inherit; text-decoration: none; }
@media (max-width: 480px) { dialog.drawer { border-radius: 0; } }
dialog::backdrop { background: rgba(10,15,12,.45); }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-size: 20px; }
.dlg-body { padding: 16px 20px 20px; display: grid; gap: 18px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.form label.full { grid-column: 1 / -1; }
.form .field { width: 100%; color: var(--fg); font-size: 14px; }
.form textarea.field { min-height: 70px; resize: vertical; }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--sunken); }
.photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.ph-aspect { margin-top: 28px; }
.ph-aspect .group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ph-aspect h2 { margin: 0; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.ph-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); padding: 0; text-align: left; color: inherit; font: inherit; cursor: zoom-in; display: flex; flex-direction: column; }
.ph-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--sunken); }
.ph-card .cap { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.ph-card .cap b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-kind { align-self: flex-start; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.ph-kind.before { background: var(--late-soft); color: var(--late); }
.ph-kind.after { background: var(--done-soft); color: var(--done); }
.ph-upload { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; align-items: end; }
.ph-upload > label:not(.btn) { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13px; font-weight: 500; }
.ph-upload .field { width: 100%; min-width: 0; }
.ph-big { display: block; max-width: 100%; max-height: 70dvh; margin: 0 auto; border-radius: 8px; }
.money-src { margin-top: 10px; }
.money-src summary { cursor: pointer; color: var(--accent); font-weight: 500; }

@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s; } }

<div id="app"><div class="gate"><div class="box"><h1>House Renovation App</h1><p class="muted">Loading…</p></div></div></div>
<dialog id="dlg"></dialog>
<dialog id="share" class="drawer" aria-label="Share"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="seed.js"></script>
<script>
(() => {
'use strict';
const CFG = window.RENO_CONFIG || { firebase: {} };
const LIVE = !!(CFG.firebase && CFG.firebase.apiKey);
const STATUSES = [
  { id: 'planned', label: 'Not Started', cls: 's-planned', color: 'var(--planned)' },
  { id: 'progress', label: 'In progress', cls: 's-progress', color: 'var(--progress)' },
  { id: 'hold', label: 'On hold', cls: 's-hold', color: 'var(--hold)' },
  { id: 'done', label: 'Completed', cls: 's-done', color: 'var(--done)' }
];
const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const FLOORS = ['Ground floor', '1st floor', '2nd floor', 'Terrace', 'Outside', 'All floors', 'Multiple', 'General'];
const TRADES = ['Manager', 'Engineer', 'Civil', 'Carpentry', 'Lift', 'Electrical', 'Plumbing', 'Welding', 'Tiles', 'Painting', 'Solar', 'CCTV', 'Paperwork', 'Family', 'Other'];
const ROLES = [
  { id: 'owner', label: 'Owner' }, { id: 'manager', label: 'Manager' }, { id: 'engineer', label: 'Engineer' },
  { id: 'contractor', label: 'Contractor' }, { id: 'family', label: 'Family' }
];
const PRIORITIES = ['High', 'Normal', 'Low'];
const CONTRACTOR_FIELDS = ['status', 'progress', 'nextSteps', 'actualDate'];

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dayNum = iso => Math.round(Date.parse(iso + 'T00:00:00Z') / 864e5);
const isoFromNum = n => new Date(n * 864e5).toISOString().slice(0, 10);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = iso => iso ? `${Number(iso.slice(8, 10))} ${MONTHS[Number(iso.slice(5, 7)) - 1]}` : '';
const fmtDateY = iso => iso ? `${fmtDate(iso)} ${iso.slice(0, 4)}` : '';
const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const inrShort = n => { n = Number(n) || 0; if (n >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr'; if (n >= 1e5) return '₹' + (n / 1e5).toFixed(2) + ' L'; return inr(n); };
const initials = s => (s || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const APP_URL = 'https://our-house-renovation.web.app';
// The address people are sent, whichever address the app was opened from
const SHARE_LINK = 'https://our-house-renovation.web.app';
function inviteText(email) {
  return `${APP_URL}\n\nHi! 😊\nYou're just a few simple steps away from accessing our House Renovation App. Let's get started!\n\n1. Open the link shared above.\n2. Click on Sign in with Google.\n3. Select the Gmail account I've added for you.\n\nThat's it! You're all set! 🎉`;
}
function shareInvite(email) {
  if (!can.members()) return;
  const text = inviteText(email);
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" class="invite-menu"><div class="dlg-head"><div><h2>Send invite</h2>${email ? `<div class="small muted">${esc(email)}</div>` : ''}</div><button class="btn" type="button" data-close>← Back</button></div>
    <div class="dlg-body"><div class="inv-grid">
      <a class="btn" href="${esc(waLink(text))}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>
      <a class="btn" href="${esc(tgLink(text))}" target="_blank" rel="noopener">${ICON.tg}Telegram</a>
      <a class="btn" href="${esc(mailLink(email || '', text))}" target="_blank" rel="noopener">${ICON.mail}Email</a>
      <button class="btn" type="button" id="inv_copy">${ICON.link}Copy link</button></div>
      <p class="small muted" id="inv_msg" style="margin:12px 0 0;min-height:1em"></p></div></form>`;
  dlg.showModal();
  dlg.querySelectorAll('.inv-grid a').forEach(a => a.addEventListener('click', () => setTimeout(() => dlg.close(), 300)));
  $('#inv_copy').onclick = async () => {
    try { await navigator.clipboard.writeText(SHARE_LINK); $('#inv_msg').textContent = 'Link copied: ' + SHARE_LINK; }
    catch { $('#inv_msg').textContent = 'Copy this link: ' + SHARE_LINK; }
  };
}
const ICON = {
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  mail: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  wa: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>',
  tg: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 19.8c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.4l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.4 2.9c.9-.3 1.7.2 1.5 1.4Z"/></svg>',
  link: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
};
// Automatic invite emails through EmailJS (free plan). Off until config.js has emailjs ids.
const EJ = (window.RENO_CONFIG && window.RENO_CONFIG.emailjs) || {};
const autoEmailOn = () => !!(EJ.serviceId && EJ.templateId && EJ.publicKey);
async function sendInviteEmail(email, role) {
  const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ service_id: EJ.serviceId, template_id: EJ.templateId, user_id: EJ.publicKey, template_params: {
      to_email: email, role: (ROLES.find(x => x.id === role) || {}).label || role, app_link: APP_URL, project: projectName(),
      from_name: state.user.name || state.user.email, reply_to: state.user.email, message: inviteText(email) } }) });
  if (!r.ok) throw new Error('EmailJS ' + r.status + ' ' + await r.text());
}
const waLink = text => 'https://wa.me/?text=' + encodeURIComponent(text);
const tgLink = text => 'https://t.me/share/url?url=' + encodeURIComponent(APP_URL) + '&text=' + encodeURIComponent(text.replace(APP_URL, '').trim());
const mailLink = (to, text) => 'https://mail.google.com/mail/?view=cm&fs=1' + (to ? '&to=' + encodeURIComponent(to) : '') + '&su=' + encodeURIComponent('Our House Renovation App') + '&body=' + encodeURIComponent(text);
function openShare() {
  if (!can.members()) return; renderShare(); const d = $('#share');
  if (!d.dataset.wired) { d.dataset.wired = '1'; d.addEventListener('click', e => { if (e.target === d) d.close(); }); }
  if (!d.open) d.showModal();
}
function renderShare() {
  const d = $('#share'); if (!d || !can.members()) return d && d.close();
  const ms = [...state.members].sort((a, b) => ROLES.findIndex(r => r.id === a.role) - ROLES.findIndex(r => r.id === b.role) || (a.name || a.email).localeCompare(b.name || b.email));
  const typed = $('#sh_email')?.value || '', typedRole = $('#sh_role')?.value || 'contractor';
  d.innerHTML = `<div class="dlg-head"><h2>Share</h2><button class="icon-btn" type="button" id="sh_close" aria-label="Close">${ICON.x}</button></div>
    <div class="sh-sec"><h3>Invite people by email</h3><form class="sh-invite" id="sh_form" novalidate>
      <input class="field" type="email" id="sh_email" placeholder="name@gmail.com" autocomplete="off" value="${esc(typed)}">
      <select class="field" id="sh_role" aria-label="Role">${ROLES.map(r => `<option value="${r.id}" ${r.id === typedRole ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
      <button class="btn primary">Invite</button></form><p class="small muted" id="sh_msg" style="margin:8px 0 0;min-height:1em"></p></div>
    <div class="sh-sec sh-list"><h3>People with access</h3>${ms.map(m => `<div class="sh-person">
      <div class="avatar">${initials(m.name || m.email)}</div>
      <div class="who-txt"><div><b>${esc(m.name || m.email.split('@')[0])}</b>${m.email === state.user.email ? ' <span class="muted small">(you)</span>' : ''}${m.disabled ? ' <span class="pill s-late">Disabled</span>' : ''}</div><div class="small muted">${esc(m.email)}</div></div>
      <select class="field" data-sh-role="${esc(m.email)}" aria-label="Role for ${esc(m.name || m.email)}">${ROLES.map(r => `<option value="${r.id}" ${r.id === m.role ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
      <button class="icon-btn" type="button" data-sh-remove="${esc(m.email)}" title="Remove access" aria-label="Remove ${esc(m.name || m.email)}">${ICON.x}</button></div>`).join('')}</div>
    <div class="sh-sec" style="border-bottom:0"><div class="sh-actions">
      <a class="btn" href="${esc(waLink(inviteText()))}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>
      <a class="btn" href="${esc(tgLink(inviteText()))}" target="_blank" rel="noopener">${ICON.tg}Telegram</a>
      <a class="btn" href="${esc(mailLink('', inviteText()))}" target="_blank" rel="noopener">${ICON.mail}Email</a>
      <button class="btn" type="button" id="sh_copy">${ICON.link}Copy link</button></div></div>`;
  const say = t => { const el = $('#sh_msg'); if (el) el.textContent = t; };
  $('#sh_close').onclick = () => d.close();
  d.querySelectorAll('[data-sh-invite]').forEach(b => b.onclick = () => shareInvite(b.dataset.shInvite));
  $('#sh_form').onsubmit = async e => {
    e.preventDefault();
    const em = $('#sh_email').value.trim().toLowerCase(), role = $('#sh_role').value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return say('Enter a valid Gmail address.');
    if (state.members.some(x => x.email === em)) return say('That address already has access.');
    try {
      await store.saveMember(em, { name: '', phone: '', trade: '', role });
      $('#sh_email').value = ''; renderShare();
      const links = `<a href="${esc(waLink(inviteText(em)))}" target="_blank" rel="noopener">WhatsApp</a> or <a href="${esc(mailLink(em, inviteText(em)))}" target="_blank" rel="noopener">Email</a>`;
      if (autoEmailOn()) {
        $('#sh_msg').textContent = `${em} can now sign in. Sending the invite email…`;
        try { await sendInviteEmail(em, role); $('#sh_msg').innerHTML = `${esc(em)} can now sign in. Invite email sent. You can also send it on <a href="${esc(waLink(inviteText(em)))}" target="_blank" rel="noopener">WhatsApp</a>.`; }
        catch (err) { console.error(err); $('#sh_msg').innerHTML = `${esc(em)} can now sign in, but the invite email could not be sent. Send it yourself: ${links}.`; }
      } else $('#sh_msg').innerHTML = `${esc(em)} can now sign in. Send them the invite: ${links}.`;
    } catch (err) { console.error(err); say('Could not add. Only owners can change the team.'); }
  };
  d.querySelectorAll('[data-sh-role]').forEach(sel => sel.onchange = async () => {
    const m = state.members.find(x => x.email === sel.dataset.shRole); if (!m) return;
    if (m.role === 'owner' && sel.value !== 'owner' && !state.members.some(x => x.role === 'owner' && !x.disabled && x.email !== m.email)) { sel.value = 'owner'; return say('This is the only Owner. Make someone else an Owner first.'); }
    try { await store.saveMember(m.email, { role: sel.value }); say(`${m.name || m.email} is now ${ROLES.find(r => r.id === sel.value).label}.`); if (m.email === state.user.email && sel.value !== 'owner') d.close(); }
    catch (err) { console.error(err); sel.value = m.role; say('Could not change the role. Only owners can do this.'); }
  });
  d.querySelectorAll('[data-sh-remove]').forEach(b => b.onclick = () => {
    const m = state.members.find(x => x.email === b.dataset.shRemove); if (!m) return;
    if (b.dataset.sure !== '1') b.classList.add('sure');
    confirmRemove(m, b, say, () => renderShare());
  });
  $('#sh_copy').onclick = async () => {
    try { await navigator.clipboard.writeText(SHARE_LINK); say('Link copied: ' + SHARE_LINK); }
    catch { say('Copy this link: ' + SHARE_LINK); }
  };
}
function shareFallback(text) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><div class="dlg-head"><h2>Share the app</h2><button class="btn" type="button" data-close>← Back</button></div>
    <p class="small muted">Copy this message and send it on WhatsApp or email.</p>
    <textarea class="field" rows="6" style="width:100%" readonly>${esc(text)}</textarea></form>`;
  dlg.showModal(); const ta = dlg.querySelector('textarea'); ta.focus(); ta.select();
}
/* ---------- notice a newer version of the app (an open tab keeps running the old one until reloaded) ---------- */
const BUILD = document.querySelector('meta[name="app-build"]')?.content || '';
async function newerBuild() {
  if (!BUILD) return false;
  try { const t = await (await fetch(location.pathname, { cache: 'no-store' })).text(); const m = t.match(/name="app-build" content="(\d+)"/); return !!m && m[1] !== BUILD; } catch { return false; }
}
async function checkForUpdate() {
  if (document.getElementById('updBar') || !(await newerBuild())) return;
  const bar = document.createElement('div'); bar.id = 'updBar'; bar.className = 'upd-bar';
  bar.innerHTML = 'A newer version of the app is available. <button class="btn sm primary" type="button">Reload now</button>';
  bar.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(bar);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
setInterval(checkForUpdate, 5 * 60 * 1000);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
function isLate(it) { return it.status !== 'done' && it.plannedEnd && it.plannedEnd < todayISO(); }
function statusPill(it) { const s = ST[it.status] || ST.planned; return `<span class="pill ${s.cls}">${s.label}</span>`; }

/* ---------- state ---------- */
const state = {
  thumbs: {}, thumbMeta: {}, thumbsOk: null,
  user: null, me: null, members: [], aspects: [], items: [], settings: {},
  filters: Object.assign({ q: '', status: '', aspect: '', floor: '', trade: '', contact: '', role: '', mine: false, late: false }, lsGet('reno-filters') || {}),
  ready: false
};
const role = () => state.me?.role || 'family';
const roleLabel = r => (ROLES.find(x => x.id === r) || {}).label || '';
const can = {
  editAll: () => ['owner', 'manager', 'engineer'].includes(role()),
  editProgress: () => ['owner', 'manager', 'engineer', 'contractor'].includes(role()),
  deleteItem: () => ['owner', 'manager', 'engineer'].includes(role()),
  deleteAspect: () => role() === 'owner',
  members: () => role() === 'owner',
  addNew: () => role() === 'owner' // adding aspects and items
};
const deadline = () => state.settings.deadline || CFG.deadline || '2026-12-25';
const projectName = () => state.settings.projectName || CFG.projectName || 'House Renovation';
const memberName = email => { const m = state.members.find(m => m.email === email); return m ? (m.name || m.email) : (email || ''); };

/* ---------- stores ---------- */
function DemoStore() {
  const KEY = 'reno-demo-v2';
  let db = lsGet(KEY);
  let listener = () => {};
  const persist = () => { lsSet(KEY, db); listener(snapshot()); };
  const demoThumbs = () => { const t = {}; [...(db.photos || [])].sort((a, b) => a.at - b.at).forEach(p => { t[p.itemId] = p.thumb || p.data; }); return t; };
  const snapshot = () => ({ members: db.members, aspects: db.aspects, items: db.items, settings: db.settings, thumbs: demoThumbs() });
  function fresh() {
    const S = window.SEED || { aspects: [], items: [] };
    const examples = { 'a01-01': ['done', 100], 'a01-02': ['done', 100], 'a01-03': ['progress', 60], 'a02-01': ['done', 100], 'a02-02': ['progress', 40], 'a04-01': ['progress', 30], 'a18-01': ['done', 100], 'a10-01': ['hold', 0] };
    const t = dayNum(todayISO());
    return {
      settings: { projectName: CFG.projectName || 'Our House Renovation', deadline: CFG.deadline || '2026-12-25', budget: 0 },
      members: [
        { email: 'demo.owner@example.com', name: 'Demo Owner (you)', role: 'owner', trade: 'Family', phone: '' },
        { email: 'site.manager@example.com', name: 'Example Site Manager', role: 'manager', trade: 'Manager', phone: '' },
        { email: 'electrician@example.com', name: 'Example Electrician', role: 'contractor', trade: 'Electrical', phone: '' }
      ],
      aspects: S.aspects.map(a => ({ ...a })),
      items: S.items.map(i => {
        const ex = examples[i.id];
        const o = { ...blankItem(), ...i, status: ex ? ex[0] : 'planned', progress: ex ? ex[1] : 0 };
        if (ex) { o.plannedStart = isoFromNum(t - 20); o.daysRequired = 30; o.plannedEnd = isoFromNum(t + 9); }
        if (ex && ex[0] === 'done') { o.plannedEnd = isoFromNum(t - 5); o.actualDate = isoFromNum(t - 6); o.estimate = 25000; o.actualSpent = 27500; }
        if (i.id === 'a01-03') { o.plannedEnd = isoFromNum(t - 2); o.estimate = 18000; o.actualSpent = 9000; }
        return o;
      }),
      comments: [], photos: []
    };
  }
  if (!db || !db.items) db = fresh();
  return {
    mode: 'demo',
    async start(onUser) { onUser({ email: db.meEmail || 'demo.owner@example.com', name: 'Demo Owner', photo: '' }); },
    async member() { return db.members.find(m => m.email === (db.meEmail || 'demo.owner@example.com')); },
    setMe(email) { db.meEmail = email; lsSet(KEY, db); },
    subscribe(cb) { listener = cb; cb(snapshot()); },
    async saveItem(id, data) { if (id) { Object.assign(db.items.find(i => i.id === id), data); } else { id = 'i' + uid(); db.items.push({ id, ...data }); } persist(); return id; },
    async deleteItem(id) { db.items = db.items.filter(i => i.id !== id); persist(); },
    async saveAspect(id, data) { if (id) Object.assign(db.aspects.find(a => a.id === id), data); else db.aspects.push({ id: 'a' + uid(), ...data }); persist(); },
    async deleteAspect(id) { db.aspects = db.aspects.filter(a => a.id !== id); persist(); },
    async saveMember(email, data) { const m = db.members.find(m => m.email === email); if (m) Object.assign(m, data); else db.members.push({ email, ...data }); persist(); },
    async deleteMember(email) { db.members = db.members.filter(m => m.email !== email); persist(); },
    async saveSettings(data) { Object.assign(db.settings, data); persist(); },
    async comments(itemId) { return db.comments.filter(c => c.itemId === itemId); },
    async commentsBetween(from, to) { return db.comments.filter(c => c.at >= from && c.at < to); },
    async addComment(c) { db.comments.push({ id: uid(), ...c, at: Date.now() }); if (!lsSet(KEY, db)) {} },
    async photos(itemId) { return db.photos.filter(p => p.itemId === itemId); },
    async allPhotos() { return [...db.photos]; },
    async addPhoto(p) { const id = uid(); db.photos.push({ id, ...p, at: Date.now() }); if (!lsSet(KEY, db)) toast('Photo kept for this visit only: browser storage is full'); state.thumbs = demoThumbs(); thumbsChanged(); return id; },
    async deletePhoto(id) { db.photos = db.photos.filter(p => p.id !== id); lsSet(KEY, db); state.thumbs = demoThumbs(); thumbsChanged(); },
    async setThumb() {}, async clearThumb() {},
    async fullExport() { return { aspects: [...db.aspects], items: [...db.items], members: [...db.members], settings: { ...db.settings }, comments: [...db.comments], photos: [...db.photos] }; },
    async statusBackup() { return { items: db.items.map(i => ({ id: i.id, title: i.title, status: i.status, progress: i.progress, actualDate: i.actualDate, plannedStart: i.plannedStart, plannedEnd: i.plannedEnd, estimate: i.estimate, actualSpent: i.actualSpent, contact: i.contact, priority: i.priority })), comments: [...db.comments], photos: [...db.photos] }; },
    async resetStatus() {
      db.items.forEach(i => Object.assign(i, { status: 'planned', progress: 0, actualDate: '', plannedStart: '', plannedEnd: '', estimate: '', actualSpent: '', contact: '', priority: 'Normal' }));
      db.comments = []; db.photos = []; persist(); state.thumbs = {}; thumbsChanged();
      return db.items.filter(i => i.contact || i.status !== 'planned').length;
    },
    async seed() {},
    async signOut() {},
    reset() { db = fresh(); state.user.email = 'demo.owner@example.com'; persist(); }
  };
}

async function FirebaseStore() {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [appM, authM, fs] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(CFG.firebase);
  const auth = authM.getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const col = n => fs.collection(db, n);
  const stamp = () => ({ updatedBy: state.user.email, updatedAt: fs.serverTimestamp() });
  const unsubs = [];
  return {
    mode: 'live',
    start(onUser) {
      authM.onAuthStateChanged(auth, u => onUser(u ? { email: (u.email || '').toLowerCase(), name: u.displayName || u.email, photo: u.photoURL || '' } : null));
    },
    async signIn() {
      const p = new authM.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await authM.signInWithPopup(auth, p); }
      catch (e) { if (e.code === 'auth/popup-blocked') await authM.signInWithRedirect(auth, p); else throw e; }
    },
    async signOut() { unsubs.splice(0).forEach(u => u()); await authM.signOut(auth); },
    async member(user) {
      const ref = fs.doc(db, 'members', user.email);
      try { const s = await fs.getDoc(ref); if (s.exists()) return s.data(); } catch {}
      // First sign-in of the owner named in the security rules: create their own record.
      try {
        const m = { email: user.email, name: user.name, role: 'owner', trade: 'Family', phone: '', addedAt: fs.serverTimestamp() };
        await fs.setDoc(ref, m); return m;
      } catch { return null; }
    },
    subscribe(cb) {
      const snap = { members: null, aspects: null, items: null, settings: null };
      const fire = () => { if (Object.values(snap).every(v => v !== null)) cb({ ...snap }); };
      const err = e => { console.error(e); toast('Lost connection to the database. Changes will sync when it is back.'); };
      unsubs.push(fs.onSnapshot(col('members'), s => { snap.members = s.docs.map(d => ({ email: d.id, ...d.data() })); fire(); }, err));
      unsubs.push(fs.onSnapshot(col('aspects'), s => { snap.aspects = s.docs.map(d => ({ id: d.id, ...d.data() })); fire(); }, err));
      unsubs.push(fs.onSnapshot(col('items'), s => { snap.items = s.docs.map(d => ({ id: d.id, ...d.data() })); fire(); }, err));
      unsubs.push(fs.onSnapshot(fs.doc(db, 'settings', 'main'), s => { snap.settings = s.exists() ? s.data() : {}; fire(); }, err));
      // Small photo thumbnails, one per item. Optional: if the database rules do not allow them yet, the app works without.
      unsubs.push(fs.onSnapshot(col('thumbs'), s => {
        state.thumbsOk = true; state.thumbs = Object.fromEntries(s.docs.map(d => [d.id, d.data().data]));
        state.thumbMeta = Object.fromEntries(s.docs.map(d => [d.id, d.data().photoId]));
        thumbsChanged();
      }, e => { state.thumbsOk = false; console.warn('Thumbnail store unavailable, building thumbnails from photos:', e.code || e); watchPhotoThumbs(); }));
      // Fallback: build each item's thumbnail in the browser from its newest photo
      const made = {};
      function watchPhotoThumbs() {
        unsubs.push(fs.onSnapshot(col('photos'), async s => {
          const newest = {};
          s.docs.forEach(d => { const x = d.data(), at = x.at?.toMillis ? x.at.toMillis() : Date.now();
            if (x.itemId && (!newest[x.itemId] || at > newest[x.itemId].at)) newest[x.itemId] = { id: d.id, at, data: x.data }; });
          const out = {};
          for (const [itemId, ph] of Object.entries(newest)) {
            if (!made[ph.id]) made[ph.id] = await makeThumb(ph.data);
            if (made[ph.id]) out[itemId] = made[ph.id];
          }
          state.thumbs = out; thumbsChanged();
        }, e => console.warn('Photos unavailable for thumbnails:', e.code || e)));
      }
    },
    async saveItem(id, data) {
      if (id) { await fs.updateDoc(fs.doc(db, 'items', id), { ...data, ...stamp() }); return id; }
      const r = await fs.addDoc(col('items'), { ...data, ...stamp() }); return r.id;
    },
    async deleteItem(id) { await fs.deleteDoc(fs.doc(db, 'items', id)); },
    async saveAspect(id, data) { if (id) await fs.updateDoc(fs.doc(db, 'aspects', id), data); else await fs.addDoc(col('aspects'), data); },
    async deleteAspect(id) { await fs.deleteDoc(fs.doc(db, 'aspects', id)); },
    async saveMember(email, data) { await fs.setDoc(fs.doc(db, 'members', email), { email, ...data }, { merge: true }); },
    async deleteMember(email) { await fs.deleteDoc(fs.doc(db, 'members', email)); },
    async saveSettings(data) { await fs.setDoc(fs.doc(db, 'settings', 'main'), data, { merge: true }); },
    async comments(itemId) {
      const s = await fs.getDocs(fs.query(col('comments'), fs.where('itemId', '==', itemId)));
      return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, at: x.at?.toMillis ? x.at.toMillis() : Date.now() }; });
    },
    async addComment(c) { await fs.addDoc(col('comments'), { ...c, at: fs.serverTimestamp() }); },
    async commentsBetween(from, to) {
      const s = await fs.getDocs(fs.query(col('comments'), fs.where('at', '>=', fs.Timestamp.fromMillis(from)), fs.where('at', '<', fs.Timestamp.fromMillis(to))));
      return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, at: x.at?.toMillis ? x.at.toMillis() : Date.now() }; });
    },
    async photos(itemId) {
      const s = await fs.getDocs(fs.query(col('photos'), fs.where('itemId', '==', itemId)));
      return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, at: x.at?.toMillis ? x.at.toMillis() : Date.now() }; });
    },
    async allPhotos() {
      const s = await fs.getDocs(col('photos'));
      return s.docs.map(d => { const x = d.data(); return { id: d.id, ...x, at: x.at?.toMillis ? x.at.toMillis() : Date.now() }; });
    },
    async addPhoto(p) { const r = await fs.addDoc(col('photos'), { ...p, at: fs.serverTimestamp() }); return r.id; },
    async deletePhoto(id) { await fs.deleteDoc(fs.doc(db, 'photos', id)); },
    async setThumb(itemId, data, photoId) { await fs.setDoc(fs.doc(db, 'thumbs', itemId), { data, photoId, by: state.user.email, at: fs.serverTimestamp() }); },
    async clearThumb(itemId) { await fs.deleteDoc(fs.doc(db, 'thumbs', itemId)); },
    async fullExport() {
      const plain = v => v && v.toMillis ? new Date(v.toMillis()).toISOString() : v;
      const all = async name => (await fs.getDocs(col(name))).docs.map(d => Object.fromEntries([['id', d.id], ...Object.entries(d.data()).map(([k, v]) => [k, plain(v)])]));
      const st = await fs.getDoc(fs.doc(db, 'settings', 'main'));
      return { aspects: await all('aspects'), items: await all('items'), members: await all('members'), settings: st.exists() ? Object.fromEntries(Object.entries(st.data()).map(([k, v]) => [k, plain(v)])) : {}, comments: await all('comments'), photos: await all('photos') };
    },
    async statusBackup() {
      const all = async name => (await fs.getDocs(col(name))).docs.map(d => { const x = d.data(); return { id: d.id, ...x, at: x.at?.toMillis ? x.at.toMillis() : x.at }; });
      return { items: state.items.map(i => ({ id: i.id, title: i.title, status: i.status, progress: i.progress, actualDate: i.actualDate, plannedStart: i.plannedStart, plannedEnd: i.plannedEnd, estimate: i.estimate, actualSpent: i.actualSpent, contact: i.contact, priority: i.priority })), comments: await all('comments'), photos: await all('photos') };
    },
    // Owner only: back to Not Started and 0% for every item; remove updates, change history and photos.
    // Aspects, item details, dates, money, team and settings are left as they are.
    async resetStatus(backup) {
      const ops = [];
      state.items.forEach(i => ops.push(b => b.update(fs.doc(db, 'items', i.id), { status: 'planned', progress: 0, actualDate: '', plannedStart: '', plannedEnd: '', estimate: '', actualSpent: '', contact: '', priority: 'Normal', ...stamp() })));
      backup.comments.forEach(c => ops.push(b => b.delete(fs.doc(db, 'comments', c.id))));
      backup.photos.forEach(p => ops.push(b => b.delete(fs.doc(db, 'photos', p.id))));
      for (let k = 0; k < ops.length; k += 400) { const b = fs.writeBatch(db); ops.slice(k, k + 400).forEach(f => f(b)); await b.commit(); }
      // Thumbnails are optional; ignore if the database rules do not cover them yet
      try { const t = await fs.getDocs(col('thumbs')); for (let k = 0; k < t.docs.length; k += 400) { const b = fs.writeBatch(db); t.docs.slice(k, k + 400).forEach(d => b.delete(d.ref)); await b.commit(); } } catch {}
      state.thumbs = {}; thumbsChanged();
      // Check the saved data on the server, not this browser's copy
      const fresh = await (fs.getDocsFromServer || fs.getDocs)(col('items'));
      return fresh.docs.filter(d => { const x = d.data(); return x.contact || (x.priority || 'Normal') !== 'Normal' || (x.status || 'planned') !== 'planned' || Number(x.progress) || x.plannedStart || x.plannedEnd; }).length;
    },
    async seed(S) {
      const b = fs.writeBatch(db);
      S.aspects.forEach(a => b.set(fs.doc(db, 'aspects', a.id), { name: a.name, floor: a.floor, order: a.order, notes: '' }));
      S.items.forEach(i => { const { id, ...rest } = i; b.set(fs.doc(db, 'items', id), { ...blankItem(), ...rest, ...stamp() }); });
      b.set(fs.doc(db, 'settings', 'main'), { projectName: CFG.projectName || 'Our House Renovation', deadline: CFG.deadline || '2026-12-25', budget: 0 }, { merge: true });
      await b.commit();
    }
  };
}

function blankItem() {
  return { aspectId: '', title: '', nextSteps: '', contact: '', trade: '', floor: '', status: 'planned', progress: 0, daysRequired: '', plannedStart: '', plannedEnd: '', actualDate: '', estimate: '', actualSpent: '', priority: 'Normal', order: 999 };
}

let store;

/* ---------- boot ---------- */
async function boot() {
  try { store = LIVE ? await FirebaseStore() : DemoStore(); }
  catch (e) { console.error(e); return renderGate('error', 'Could not reach Google services. Check your internet connection and reload.'); }
  store.start(async user => {
    state.user = user;
    if (!user) return renderGate('signin');
    renderGate('loading');
    const me = await store.member(user);
    if (!me) return renderGate('denied');
    if (me.disabled) return renderGate('disabled');
    state.me = me;
    store.subscribe(snap => {
      Object.assign(state, snap, { ready: true });
      const fresh = state.members.find(m => m.email === user.email);
      if (fresh) state.me = fresh;
      render();
    });
  });
}

function renderGate(kind, msg) {
  const app = $('#app');
  const G = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  let body = '';
  if (kind === 'signin') body = `<p class="muted">Sign in with the Google account the owner added to the project.</p><button class="gbtn" id="gsign">${G} Sign in with Google</button><p class="small muted" id="gerr"></p>`;
  else if (kind === 'denied') body = `<p><b>${esc(state.user.email)}</b> is not on the project list yet.</p><p class="muted">Ask the owner to add this Gmail address under Team, then sign in again.</p><button class="btn" id="gout">Use a different account</button>`;
  else if (kind === 'disabled') body = `<p>Access for <b>${esc(state.user.email)}</b> has been turned off.</p><p class="muted">Ask the owner to enable it again on the Team page.</p><button class="btn" id="gout">Use a different account</button>`;
  else if (kind === 'error') body = `<p class="muted">${esc(msg)}</p>`;
  else body = '<p class="muted">Loading the project…</p>';
  app.innerHTML = `<div class="gate"><div class="box"><h1>House Renovation App</h1>${body}</div></div>`;
  $('#gsign')?.addEventListener('click', async () => {
    try { await store.signIn(); } catch (e) { $('#gerr').textContent = e.code === 'auth/unauthorized-domain' ? 'This web address is not yet allowed in Firebase (Authentication > Settings > Authorized domains).' : 'Sign-in did not complete. Please try again.'; }
  });
  $('#gout')?.addEventListener('click', () => store.signOut());
}

];

function sortedAspects() { return [...state.aspects].sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.name.localeCompare(b.name)); }
function aspectName(id) { return state.aspects.find(a => a.id === id)?.name || 'Unsorted'; }
function itemsOf(aid) { return state.items.filter(i => i.aspectId === aid).sort((a, b) => (a.order ?? 999) - (b.order ?? 999)); }
function avgProgress(items) { if (!items.length) return 0; return Math.round(items.reduce((s, i) => s + (i.status === 'done' ? 100 : Number(i.progress) || 0), 0) / items.length); }

function setFilters(f, go = 'items') { state.filters = Object.assign({ q: '', status: '', aspect: '', floor: '', trade: '', contact: '', role: '', mine: false, late: false }, f); lsSet('reno-filters', state.filters); if (currentView() === go) render(); else location.hash = go; }

/* ---------- dashboard ---------- */
function viewDashboard(main) {
  const items = state.items;
  const today = todayISO();
  const daysLeft = dayNum(deadline()) - dayNum(today);
  const counts = Object.fromEntries(STATUSES.map(s => [s.id, items.filter(i => (i.status || 'planned') === s.id).length]));
  const late = items.filter(isLate).sort((a, b) => a.plannedEnd.localeCompare(b.plannedEnd));
  const DUE_OPTS = Array.from({ length: 30 }, (_, i) => i + 1);
  const dueDays = DUE_OPTS.includes(Number(lsGet('reno-due-days'))) ? Number(lsGet('reno-due-days')) : 7;
  const in7 = isoFromNum(dayNum(today) + dueDays);
  const soon = items.filter(i => i.status !== 'done' && i.plannedEnd && i.plannedEnd >= today && i.plannedEnd <= in7).sort((a, b) => a.plannedEnd.localeCompare(b.plannedEnd));
  const est = items.reduce((s, i) => s + (Number(i.estimate) || 0), 0);
  const spent = items.reduce((s, i) => s + (Number(i.actualSpent) || 0), 0);
  const budget = Number(state.settings.budget) || 0;

  const row = i => `<div class="list-row" data-open="${esc(i.id)}">${th(i.id)}<div class="t"><b>${esc(i.title)}</b><span class="small muted">${esc(aspectName(i.aspectId))}${i.contact ? ' · ' + esc(memberName(i.contact)) : ''}</span></div><span class="small num ${isLate(i) ? '' : 'muted'}" style="${isLate(i) ? 'color:var(--late)' : ''}">${fmtDate(i.plannedEnd)}</span>${statusPill(i)}</div>`;

    <div class="section-head"><div><h1>Where the renovation stands</h1><p>${items.length} items across ${state.aspects.length} aspects · today ${fmtDateY(today)}</p></div>
</div>
    ${items.length === 0 ? seedPanel() : ''}

      <div class="kpi"><div class="label">Overall progress</div><div class="value num">${pct}%</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
      ${STATUSES.map(s => `<button class="kpi" data-filter-status="${s.id}"><div class="label">${s.label}</div><div class="value num" style="color:${s.color}">${counts[s.id]}</div><div class="sub">items</div></button>`).join('')}
      <button class="kpi" data-filter-late><div class="label">Overdue</div><div class="value num" style="color:${late.length ? 'var(--late)' : 'inherit'}">${late.length}</div><div class="sub">past planned end</div></button>
    </div>
    <div class="grid2">
      <section class="panel">${secHead('overdue', '<h2>Overdue</h2>')}<div class="dsec-body" ${secHidden('overdue')}><div class="list">${late.length ? late.slice(0, 8).map(row).join('') : '<div class="empty">Nothing overdue.</div>'}</div></div>
        <div class="dsec-head" style="margin-top:22px"><h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0">Due in the next <select id="dueDays" class="field" aria-label="Number of days" style="width:auto;padding:2px 6px;font:inherit">${DUE_OPTS.map(n => `<option value="${n}" ${n === dueDays ? 'selected' : ''}>${n}</option>`).join('')}</select> ${dueDays === 1 ? 'day' : 'days'}</h2>${hideBtn('due')}</div><div class="dsec-body" ${secHidden('due')}><div class="list">${soon.length ? soon.slice(0, 8).map(row).join('') : `<div class="empty">Nothing due in the next ${dueDays === 1 ? 'day' : dueDays + ' days'}.${undated ? ` ${undated} open items have no planned end date yet.` : ''}</div>`}</div></div>
      </section>

function seedPanel() {

function wireCommon(root) {
  root.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('select,button:not([data-open]),a')) return; openItem(el.dataset.open); }));
  root.querySelectorAll('[data-add-item]').forEach(b => b.onclick = () => { if (can.addNew()) openItem(null, { aspectId: b.dataset.addItem || '' }); });
  const sb = $('#seedBtn', root); if (sb) sb.onclick = async () => { sb.disabled = true; sb.textContent = 'Loading…'; try { await store.seed(window.SEED); toast('Excel plan loaded'); } catch (e) { console.error(e); toast('Could not load the plan. Check the security rules.'); sb.disabled = false; } };
  root.querySelectorAll('select[data-status-of]').forEach(s => s.onchange = () => quickStatus(s.dataset.statusOf, s.value));
}

async function quickStatus(id, status) {
  const it = state.items.find(i => i.id === id); if (!it) return;
  const patch = { status };
  if (status === 'done') { patch.progress = 100; if (!it.actualDate) patch.actualDate = todayISO(); }
  if (status === 'progress' && !(Number(it.progress) > 0)) patch.progress = 10;
  const before = { ...it };
  try { await store.saveItem(id, patch); logChanges(before, patch); toast(`${it.title}: ${ST[status].label}`); }
  catch (e) { console.error(e); toast('You do not have permission to change this.'); render(); }
}

  return state.items.filter(i =>
    (!f.status || (i.status || 'planned') === f.status) && (!f.aspect || i.aspectId === f.aspect) && (!f.floor || i.floor === f.floor) &&
    (!f.trade || i.trade === f.trade) && (!f.contact || i.contact === f.contact) && (!f.role || (state.members.find(m => m.email === i.contact) || {}).role === f.role) && (!f.mine || i.contact === state.user.email) && (!f.late || isLate(i)) &&

}

function exportCsv() {
  const cols = ['Aspect', 'Details', 'Requirement/Next Steps', 'Point of Contact', 'Contact Role', 'Trade', 'Floor', 'Status', 'Progress %', 'No. of Days Required', 'Planned Start', 'Planned Date', 'Actual Date', 'Estimate', 'Actual Spent', 'Priority'];
  const rows = [];
  sortedAspects().forEach(a => itemsOf(a.id).forEach(i => rows.push([a.name, i.title, i.nextSteps, memberName(i.contact), roleLabel((state.members.find(m => m.email === i.contact) || {}).role), i.trade, i.floor, (ST[i.status] || ST.planned).label, i.status === 'done' ? 100 : i.progress, i.daysRequired, i.plannedStart, i.plannedEnd, i.actualDate, i.estimate, i.actualSpent, i.priority])));
  const csv = [cols, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const filename = `renovation-${todayISO()}.csv`;
  if (window.claude) {
    // Inside the Claude demo page, files go through Claude's save prompt
    dlNS.then(dl => {
      if (!dl) return toast('Saving files is not available here. It works in the live app.');
      dl.save({ filename, data: '\ufeff' + csv }).then(() => toast('Saved ' + filename)).catch(e => toast(e && e.code === 'declined' ? 'Export cancelled' : 'Could not save the file here. It works in the live app.'));
    });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded ' + filename + '. It opens in Excel.');
}

/* ---------- timeline ---------- */
function viewTimeline(main) {
  const dated = state.items.filter(i => i.plannedStart || i.plannedEnd);
  const today = todayISO();
  const starts = dated.map(i => dayNum(i.plannedStart || i.plannedEnd)), ends = dated.map(i => dayNum(i.plannedEnd || i.plannedStart));
  let lo = Math.min(dayNum(today) - 7, ...starts), hi = Math.max(dayNum(deadline()) + 5, ...ends);
  const span = Math.max(1, hi - lo);
  const X = n => ((n - lo) / span * 100).toFixed(3) + '%';
  const ticks = [];
  if (span <= 120) { let n = lo + ((4 - (lo % 7)) + 7) % 7; while (n < hi) { ticks.push([n, fmtDate(isoFromNum(n))]); n += 7; } } // weekly, on Mondays
  else { const d = new Date(lo * 864e5); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + 1); while (d.getTime() / 864e5 < hi) { ticks.push([Math.round(d.getTime() / 864e5), `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`]); d.setUTCMonth(d.getUTCMonth() + 1); } }
  const undated = state.items.length - dated.length;
  const rows = sortedAspects().map(a => { const its = itemsOf(a.id).filter(i => i.plannedStart || i.plannedEnd); if (!its.length) return ''; return `<div class="tl-row grp"><div class="tl-name">${esc(a.name)}</div><div class="tl-track"></div></div>` + its.map(i => { const s = dayNum(i.plannedStart || i.plannedEnd), e = dayNum(i.plannedEnd || i.plannedStart); const st = ST[i.status] || ST.planned; const col = isLate(i) ? 'var(--late)' : st.color; return `<div class="tl-row"><div class="tl-name" data-open="${esc(i.id)}" title="${esc(i.title)}">${th(i.id, 'tiny')}<span class="tl-t">${esc(i.title)}</span></div><div class="tl-track"><div class="tl-bar" data-open="${esc(i.id)}" title="${esc(i.title)}: ${fmtDate(i.plannedStart)} to ${fmtDate(i.plannedEnd)}" style="left:${X(s)};width:max(6px, calc(${X(e + 1)} - ${X(s)}));background:${col}"></div></div></div>`; }).join(''); }).join('');
  main.innerHTML = `<div class="section-head"><div><h1>Timeline</h1><p>Planned start to planned end for each dated item. Blue line is today, red dashed line is the ${fmtDate(deadline())} hand-over.</p></div></div>
    <div class="legend">${STATUSES.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}<span><i style="background:var(--late)"></i>Overdue</span></div>
    ${dated.length ? `<div class="tl-wrap"><div class="tl">
      <div class="tl-row head"><div class="tl-name">Item</div><div class="tl-track">${ticks.filter(([t]) => (t - lo) / span < 0.95).map(([t, l]) => `<div class="tl-tick" style="left:${X(t)}"><span>${l}</span></div>`).join('')}</div></div>
      <div style="position:relative">${rows}
        <div style="position:absolute;inset:0 0 0 240px;pointer-events:none"><div class="tl-line today" style="left:${X(dayNum(today))}"></div><div class="tl-line" style="left:${X(dayNum(deadline()))}"></div></div></div>
    </div></div>` : ''}
    <p class="muted small" style="margin-top:12px">${undated ? `${undated} item${undated === 1 ? ' has' : 's have'} no planned dates yet. Open an item and set a planned start and days required to place it here.` : 'Every item has dates.'}</p>`;
  wireCommon(main);
}

function editAspect(id) {
  const a = id ? state.aspects.find(x => x.id === id) : { name: '', floor: '', notes: '' };
  const n = id ? itemsOf(id).length : 0;
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" id="af"><div class="dlg-head"><h2>${id ? 'Edit aspect' : 'New renovation aspect'}</h2><button class="btn" type="button" data-close>← Back</button></div>

      <label class="full">Name<input class="field" id="a_name" required value="${esc(a.name)}" placeholder="e.g. First floor balcony"></label>
      <label>Floor<select class="field" id="a_floor"><option value=""></option>${FLOORS.map(f => `<option ${f === a.floor ? 'selected' : ''}>${f}</option>`).join('')}</select></label>

    </div>
    <div class="row-actions"><button class="btn primary" value="save">Save</button><button class="btn" type="button" data-close>Cancel</button>${id && can.deleteAspect() ? `<button class="btn danger" type="button" id="a_del">Delete aspect</button>` : ''}<span class="small muted" id="a_msg"></span></div></div></form>`;
  dlg.showModal();
