/* ---------- reset backup: an organised Excel file (plus the photos themselves, if any) ---------- */
const isDefaultItem = i => (i.status || 'planned') === 'planned' && !Number(i.progress) && !i.actualDate && !i.plannedStart && !i.plannedEnd && !i.estimate && !i.actualSpent && !i.contact && (i.priority || 'Normal') === 'Normal';
const backupHasData = b => b.items.some(i => !isDefaultItem(i)) || b.comments.length > 0 || b.photos.length > 0;
async function downloadResetBackup(b) {
  await loadScript('vendor/xlsx.full.min.js');
  const X = window.XLSX, wb = X.utils.book_new();
  const now = new Date(), stampTxt = now.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const full = id => state.items.find(i => i.id === id) || {};
  const itemName = id => (full(id).title || (b.items.find(i => i.id === id) || {}).title || '(deleted item)');
  const aspectOf = id => aspectName(full(id).aspectId) || '';
  const person = e => e ? `${memberName(e)}${memberName(e) !== e ? ' (' + e + ')' : ''}` : '';
  const when = ms => ms ? new Date(ms).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const d = iso => iso ? fmtDateY(iso) : '';
  const money = v => (v === '' || v == null) ? '' : Number(v);
  const changed = b.items.filter(i => !isDefaultItem(i)).length;
  const sheet = (name, rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); if (rows.length > 1) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length - 1, c: rows[0].length - 1 } }) }; X.utils.book_append_sheet(wb, ws, name); };
  const sorted = [...b.items].sort((x, y) => (sortedAspects().findIndex(a => a.id === full(x.id).aspectId) - sortedAspects().findIndex(a => a.id === full(y.id).aspectId)) || (full(x.id).order || 0) - (full(y.id).order || 0));
  sheet('Summary', [
    ['Backup before reset', projectName()],
    ['Saved on', stampTxt],
    ['Saved by', person(state.user.email)],
    [],
    ['Items in the project', b.items.length],
    ['Items with status, priority, dates, amounts or a person (cleared by the reset)', changed],
    ['Progress updates and notes', b.comments.length],
    ['Photos', b.photos.length],
    [],
    ['What is in this file', ''],
    ['Items', 'Every item as it was just before the reset: status, progress, priority, dates, amounts and who it was assigned to.'],
    ['Updates and history', 'Every note and status change, newest first.'],
    ['Photos', b.photos.length ? 'A list of the photos. The photos themselves are saved in a second file, photos-backup, downloaded at the same time.' : 'There were no photos.']
  ], [62, 90]);
  sheet('Items', [['Aspect', 'Floor', 'Item', 'Status', 'Progress %', 'Priority', 'Planned start', 'Due date', 'Completed on', 'Estimate (₹)', 'Spent (₹)', 'Assigned to', 'Item ID'],
    ...sorted.map(i => { const f = full(i.id); return [aspectOf(i.id), f.floor || '', i.title || f.title || '', (ST[i.status] || ST.planned).label, Number(i.progress) || 0, i.priority || 'Normal', d(i.plannedStart), d(i.plannedEnd), d(i.actualDate), money(i.estimate), money(i.actualSpent), person(i.contact), i.id]; })],
    [24, 14, 44, 13, 11, 10, 14, 14, 14, 13, 13, 34, 10]);
  const chg = c => { const x = parseChange(c), out = [];
    if (x.status) out.push(`Status: ${(ST[x.status[0]] || {}).label || x.status[0] || '–'} → ${(ST[x.status[1]] || {}).label || x.status[1] || '–'}`);
    if (x.progress) out.push(`Progress: ${x.progress[0]}% → ${x.progress[1]}%`);
    if (x.contact) out.push(`Assigned: ${memberName(x.contact[0]) || 'nobody'} → ${memberName(x.contact[1]) || 'nobody'}`);
    return out.join(' · '); };
  // Older entries were written with the old status names
  const relabel = t => String(t || '').replace(/\bPlanned\b(?! (start|end))/g, 'Not Started').replace(/\bDone\b/g, 'Completed');
  const details = c => c.kind === 'change' ? (c.text ? relabel(c.text) : chg(c)) : (c.text || '');
  sheet('Updates and history', [['When', 'Aspect', 'Item', 'Type', 'By', 'Details'],
    ...[...b.comments].sort((x, y) => (y.at || 0) - (x.at || 0)).map(c => [when(c.at), aspectOf(c.itemId), itemName(c.itemId), c.kind === 'change' ? 'Change' : 'Note', person(c.by), details(c)])],
    [20, 22, 40, 14, 32, 70]);
  sheet('Photos', [['When', 'Aspect', 'Item', 'Before / after', 'Uploaded by', 'Photo ID'],
    ...[...b.photos].sort((x, y) => (y.at || 0) - (x.at || 0)).map(ph => [when(ph.at), aspectOf(ph.itemId), itemName(ph.itemId), ph.kind ? ph.kind[0].toUpperCase() + ph.kind.slice(1) : '', person(ph.by), ph.id])],
    [20, 22, 40, 14, 32, 24]);
  const tag = `${todayISO()}-${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
  saveBlob(`reset-backup-${tag}.xlsx`, new Blob([X.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  if (b.photos.length) {
    const photos = b.photos.map(ph => ({ id: ph.id, item: itemName(ph.itemId), itemId: ph.itemId, kind: ph.kind || '', by: ph.by || '', at: ph.at ? new Date(ph.at).toISOString() : '', image: ph.data }));
    saveBlob(`photos-backup-${tag}.json`, new Blob([JSON.stringify({ project: projectName(), savedAt: now.toISOString(), photos }, null, 2)], { type: 'application/json' }));
  }
}
// Owner-only, read-only snapshot of the whole project: a readable Excel file plus a complete JSON file (with photos)
async function downloadFullBackup() {
  if (!can.members()) return;
  const x = await store.fullExport();
  await loadScript('vendor/xlsx.full.min.js');
  const X = window.XLSX, wb = X.utils.book_new();
  const now = new Date(), tag = `${todayISO()}-${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
  const ms = v => typeof v === 'number' ? v : v ? Date.parse(v) : 0;
  const when = v => ms(v) ? new Date(ms(v)).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const asp = Object.fromEntries(x.aspects.map(a => [a.id, a]));
  const it = Object.fromEntries(x.items.map(i => [i.id, i]));
  const mem = Object.fromEntries(x.members.map(m => [m.id || m.email, m]));
  const who = e => e ? (mem[e] && mem[e].name ? `${mem[e].name} (${e})` : e) : '';
  const sheet = (name, rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
  const aspects = [...x.aspects].sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
  sheet('Summary', [['Full backup', projectName()], ['Saved on', when(now.getTime())], ['Saved by', who(state.user.email)], [],
    ['Aspects', x.aspects.length], ['Items', x.items.length], ['Team members', x.members.length], ['Updates and history', x.comments.length], ['Photos', x.photos.length], [],
    ['Hand-over date', x.settings.deadline ? fmtDateY(x.settings.deadline) : ''], ['Overall budget (₹)', x.settings.budget || ''],
    [], ['Note', 'The photos themselves, and every field exactly as stored, are in the matching full-backup .json file.']], [26, 80]);
  sheet('Aspects', [['Order', 'Aspect', 'Floor', 'Notes', 'Items', 'Aspect ID'], ...aspects.map(a => [a.order ?? '', a.name || '', a.floor || '', a.notes || '', x.items.filter(i => i.aspectId === a.id).length, a.id])], [7, 28, 14, 40, 7, 12]);
  const items = [...x.items].sort((a, b) => ((asp[a.aspectId] || {}).order ?? 999) - ((asp[b.aspectId] || {}).order ?? 999) || (a.order ?? 999) - (b.order ?? 999));
  sheet('Items', [['Aspect', 'Item', 'Status', 'Progress %', 'Trade', 'Floor', 'Priority', 'Assigned to', 'Next steps', 'Days required', 'Planned start', 'Due date', 'Completed on', 'Estimate (₹)', 'Spent (₹)', 'Last changed by', 'Item ID'],
    ...items.map(i => [(asp[i.aspectId] || {}).name || '', i.title || '', (ST[i.status] || ST.planned).label, Number(i.progress) || 0, i.trade || '', i.floor || '', i.priority || '', who(i.contact), i.nextSteps || '', i.daysRequired || '', i.plannedStart ? fmtDateY(i.plannedStart) : '', i.plannedEnd ? fmtDateY(i.plannedEnd) : '', i.actualDate ? fmtDateY(i.actualDate) : '', i.estimate === '' || i.estimate == null ? '' : Number(i.estimate), i.actualSpent === '' || i.actualSpent == null ? '' : Number(i.actualSpent), who(i.updatedBy), i.id])],
    [24, 40, 12, 10, 12, 12, 9, 30, 40, 8, 13, 13, 13, 12, 12, 30, 12]);
  sheet('Team', [['Name', 'Email', 'Role', 'Trade', 'Phone', 'Access'], ...x.members.map(m => [m.name || '', m.id || m.email, (ROLES.find(r => r.id === m.role) || {}).label || m.role || '', m.trade || '', m.phone || '', m.disabled ? 'Disabled' : 'Enabled'])], [24, 32, 12, 14, 16, 10]);
  sheet('Updates and history', [['When', 'Aspect', 'Item', 'Type', 'By', 'Details'],
    ...[...x.comments].sort((a, b) => ms(b.at) - ms(a.at)).map(c => [when(c.at), (asp[(it[c.itemId] || {}).aspectId] || {}).name || '', (it[c.itemId] || {}).title || '', c.kind === 'change' ? 'Change' : 'Note', who(c.by), c.text || ''])], [20, 22, 40, 10, 30, 70]);
  sheet('Photos', [['When', 'Aspect', 'Item', 'Before / after', 'Uploaded by', 'Photo ID'],
    ...[...x.photos].sort((a, b) => ms(b.at) - ms(a.at)).map(ph => [when(ph.at), (asp[(it[ph.itemId] || {}).aspectId] || {}).name || '', (it[ph.itemId] || {}).title || '', ph.kind || '', who(ph.by), ph.id])], [20, 22, 40, 12, 30, 24]);
  saveBlob(`full-backup-${tag}.xlsx`, new Blob([X.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  saveBlob(`full-backup-${tag}.json`, new Blob([JSON.stringify({ project: projectName(), savedAt: now.toISOString(), savedBy: state.user.email, ...x }, null, 2)], { type: 'application/json' }));
}
function confirmResetStatus() {
  if (!can.members()) return;
  const dlg = $('#dlg');
  const nItems = state.items.length;
  dlg.innerHTML = `<div class="dlg-head"><h2>Reset status data?</h2><button class="btn" type="button" data-close>← Back</button></div>
    <div class="dlg-body">
      <p><b>This cannot be undone.</b> For all ${nItems} items, for everyone using the app:</p>
      <ul class="small" style="margin:6px 0 12px 18px;line-height:1.7">
        <li>Status goes back to <b>Not Started</b> and progress to <b>0%</b>, and all start, due and completion dates are cleared</li>
        <li>All estimates and amounts spent are cleared</li>
        <li>Every item becomes unassigned (no point of contact)</li>
        <li>Every item's priority goes back to Normal</li>
        <li>All progress updates, notes and change history are deleted</li>
        <li>All uploaded photos are deleted</li></ul>
      <p class="small muted">Kept as they are: aspects, items and their details, categories, the team and project settings (including the overall budget). A backup Excel file of everything that is cleared downloads to this device first.</p>
      <label class="small" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px"><span>Type <b>RESET</b> to confirm</span><input class="field" id="rs_word" autocomplete="off" style="max-width:240px"></label>
      <div class="row-actions"><button class="btn danger" type="button" id="rs_go" disabled>Reset status data</button><button class="btn" type="button" data-close>Cancel</button><span class="small muted" id="rs_msg"></span></div></div>`;
  dlg.showModal();
  const go = $('#rs_go'), word = $('#rs_word'), msg = $('#rs_msg');
  word.focus();
  word.oninput = () => { go.disabled = word.value.trim().toUpperCase() !== 'RESET'; };
  dlg.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
  go.onclick = async () => {
    go.disabled = true; word.disabled = true;
    if (await newerBuild()) { msg.textContent = 'The app was just updated. Reloading so the reset uses the latest version… then please press Reset again.'; setTimeout(() => location.reload(), 2500); return; }
    msg.textContent = 'Saving a backup…';
    try {
      const backup = await store.statusBackup();
      if (!backupHasData(backup)) { msg.textContent = 'Nothing to reset: every item is already Not Started, Normal priority, unassigned, with no dates, amounts, updates or photos.'; return; }
      await downloadResetBackup(backup);
      msg.textContent = 'Resetting…';
      const left = await store.resetStatus(backup);
      if (left) { msg.textContent = `${left} item${left === 1 ? ' was' : 's were'} not fully reset. Please refresh the page and press Reset again.`; go.disabled = false; word.disabled = false; return; }
      dlg.close(); toast('Status data reset. Every item is back to Not Started and unassigned.');
    } catch (err) { console.error(err); msg.textContent = 'Could not finish the reset. Check your connection and try again. Only Owners can do this.'; go.disabled = false; word.disabled = false; }
  };
}
function removeBlock(m) {
  const email = m.email;
  if (m.role === 'owner' && !state.members.some(x => x.role === 'owner' && x.email !== email)) return 'This is the only Owner. Make someone else an Owner first, then remove this person.';
  if (email === state.user.email && store.mode === 'demo') return 'In the demo you are signed in as this person, so it cannot be removed. In the live app it can.';
  return '';
}
async function confirmRemove(m, btn, say, done) {
  const email = m.email;
  const block = removeBlock(m); if (block) return say(block);
  if (btn.dataset.sure !== '1') {
    btn.dataset.sure = '1'; btn.textContent = 'Yes, remove';
    say(email === state.user.email ? 'You will lose access to the app. Tap "Yes, remove" to confirm.' : `${m.name || email} will be removed permanently and can no longer sign in. Their items stay, with no point of contact. Tap "Yes, remove" to confirm.`);
    return;
  }
  try {
    for (const it of state.items.filter(i => i.contact === email)) await store.saveItem(it.id, { contact: '' });
    await store.deleteMember(email); done && done(); toast(`${m.name || email} removed`);
    if (email === state.user.email) store.signOut();
  } catch (err) { console.error(err); say('Could not remove. Only owners can change the team.'); }
}

function editMember(email) {
  const m = email ? state.members.find(x => x.email === email) : { email: '', name: '', role: 'contractor', trade: '', phone: '' };
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" id="mf"><div class="dlg-head"><h2>${email ? 'Edit person' : 'Add a person'}</h2><button class="btn" type="button" data-close>← Back</button></div>

      <label class="full">Gmail address (used to sign in)<input class="field" type="email" id="m_email" required value="${esc(m.email)}" placeholder="name@gmail.com"></label>${email === state.user.email && store.mode === 'live' ? '<p class="small muted full" style="grid-column:1/-1;margin:0">This is your own sign-in address. If you change it, you will be signed out and must sign in again with the new Gmail.</p>' : ''}
      <label>Name<input class="field" id="m_name" value="${esc(m.name || '')}" required></label>
      <label>Phone<input class="field" type="tel" id="m_phone" value="${esc(m.phone || '')}" placeholder="+91 98xxx xxxxx"></label>
      <label>Role<select class="field" id="m_role">${ROLES.map(r => `<option value="${r.id}" ${r.id === m.role ? 'selected' : ''}>${r.label}</option>`).join('')}</select></label>
      <label>Trade<select class="field" id="m_trade"><option value=""></option>${TRADES.map(t => `<option ${t === m.trade ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>
    <div class="row-actions"><button class="btn primary" value="save">Save</button><button class="btn" type="button" data-close>Cancel</button><span class="small muted" id="m_msg"></span></div></div></form>`;
  dlg.showModal();
  $('#mf').onsubmit = async e => {
    if (e.submitter?.value !== 'save') return;
    e.preventDefault();
    const em = $('#m_email').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $('#m_msg').textContent = 'Enter a valid email address.'; return; }
    if (em !== email && state.members.some(x => x.email === em)) { $('#m_msg').textContent = 'That address is already on the team.'; return; }
    try {
      await store.saveMember(em, { name: $('#m_name').value.trim(), phone: $('#m_phone').value.trim(), role: $('#m_role').value, trade: $('#m_trade').value });
      if (email && em !== email) {
        // Gmail changed: move their items to the new address, then remove the old one
        for (const it of state.items.filter(i => i.contact === email)) await store.saveItem(it.id, { contact: em });

function buildReport(r, log) {
  const items = state.items, byId = new Map(items.map(i => [i.id, i]));
  const changes = log.filter(c => c.kind === 'change' && byId.has(c.itemId)).sort((a, b) => a.at - b.at);
  const notes = log.filter(c => c.kind !== 'change' && byId.has(c.itemId)).sort((a, b) => a.at - b.at);
  const completed = new Map(), started = new Map(), held = new Map(), moved = new Map();
  changes.forEach(c => {
    const ch = parseChange(c), it = byId.get(c.itemId);
    if (ch.status && ch.status[1] === 'done') completed.set(it.id, { it, by: c.by, at: c.at });
    if (ch.status && ch.status[1] === 'progress') started.set(it.id, { it, by: c.by, at: c.at });
    if (ch.status && ch.status[1] === 'hold') held.set(it.id, { it, by: c.by, at: c.at });
    if (ch.progress) { const m = moved.get(it.id) || { it, from: Number(ch.progress[0]) || 0, by: c.by }; m.to = Number(ch.progress[1]) || 0; m.by = c.by; moved.set(it.id, m); }
  });
  // Items marked complete with a completion date in this period, even without a logged change
  items.forEach(i => { if (i.status === 'done' && i.actualDate && i.actualDate >= r.from && i.actualDate < r.to && !completed.has(i.id)) completed.set(i.id, { it: i, by: i.updatedBy, at: localMs(i.actualDate) }); });
  const now = s => items.filter(i => (i.status || 'planned') === s);
  const overdue = items.filter(isLate).sort((a, b) => a.plannedEnd.localeCompare(b.plannedEnd));
  const pendingDue = now('planned').filter(i => (i.plannedStart && i.plannedStart < r.to) || (i.plannedEnd && i.plannedEnd < isoFromNum(dayNum(r.to) + 7)));
  const people = new Map();
  const P = email => { const k = email || ''; if (!people.has(k)) people.set(k, { email: k, open: 0, prog: 0, hold: 0, late: 0, done: 0, updates: 0 }); return people.get(k); };
  items.forEach(i => { const p = P(i.contact); if (i.status !== 'done') p.open++; if (i.status === 'progress') p.prog++; if (i.status === 'hold') p.hold++; if (isLate(i)) p.late++; });
  completed.forEach(({ it }) => P(it.contact).done++);
  const touched = new Set(); changes.concat(notes).forEach(c => touched.add(c.itemId + '|' + c.by));
  touched.forEach(k => { const [id] = k.split('|'); P(byId.get(id).contact).updates++; });
  const perDay = {}; if (r.to > r.from) for (let n = dayNum(r.from); n < dayNum(r.to); n++) perDay[isoFromNum(n)] = 0;
  completed.forEach(({ at }) => { const d = new Date(at), iso = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); if (iso in perDay) perDay[iso]++; });
  return { r, completed: [...completed.values()], started: [...started.values()].filter(x => !completed.has(x.it.id)), held: [...held.values()], moved: [...moved.values()].filter(m => m.to !== m.from && !completed.has(m.it.id)),
    inProgress: now('progress'), onHold: now('hold'), pending: now('planned'), pendingDue, overdue, notes, changes, perDay,
    people: [...people.values()].filter(p => p.open || p.done || p.updates).sort((a, b) => (a.email ? 0 : 1) - (b.email ? 0 : 1) || b.late - a.late || b.open - a.open),
    pct: avgProgress(items), total: items.length, doneTotal: now('done').length };
}

function reportText(R, weekly) {

  L.push(`Overall progress: ${R.pct}% · ${R.doneTotal}/${R.total} items completed`, '');
  L.push(`✅ *Completed (${R.completed.length})*`); R.completed.forEach(c => L.push(`• ${nm(c.it)}`)); if (!R.completed.length) L.push('• None'); L.push('');
  L.push(`🔄 *In progress (${R.inProgress.length})*`); R.inProgress.forEach(i => { const m = R.moved.find(x => x.it.id === i.id); L.push(`• ${nm(i)}: ${Number(i.progress) || 0}%${m ? ` (+${m.to - m.from}%)` : ''}`); }); if (!R.inProgress.length) L.push('• None'); L.push('');
  L.push(`⏸️ *On hold (${R.onHold.length})*`); R.onHold.forEach(i => L.push(`• ${nm(i)}`)); if (!R.onHold.length) L.push('• None'); L.push('');
  L.push(`⚠️ *Overdue (${R.overdue.length})*`); R.overdue.forEach(i => L.push(`• ${nm(i)}: due ${fmtDate(i.plannedEnd)}`)); if (!R.overdue.length) L.push('• None'); L.push('');

}

function moneyDialog(kind) {
  const items = state.items;
  const est = items.reduce((s, i) => s + (Number(i.estimate) || 0), 0);
  const spent = items.reduce((s, i) => s + (Number(i.actualSpent) || 0), 0);
  const budget = Number(state.settings.budget) || 0;
  const key = kind === 'spent' ? 'actualSpent' : 'estimate';
  const title = { estimate: 'Estimated cost', spent: 'Spent so far', budget: 'Budget' }[kind];
  const rowsFor = k => items.filter(i => Number(i[k])).sort((a, b) => Number(b[k]) - Number(a[k]));
  const itemRow = i => `<div class="list-row" data-money-open="${esc(i.id)}">${th(i.id)}<div class="t"><b>${esc(i.title)}</b><span class="small muted">${esc(aspectName(i.aspectId))}${i.updatedBy ? ' · last changed by ' + esc(memberName(i.updatedBy)) : ''}</span></div><span class="small num" style="text-align:right">${i.estimate ? 'Est. ' + inr(i.estimate) : ''}${i.estimate && i.actualSpent ? '<br>' : ''}${i.actualSpent ? 'Spent ' + inr(i.actualSpent) : ''}</span></div>`;
  let body;
  if (kind === 'budget') {
    const byAspect = sortedAspects().map(a => { const its = items.filter(i => i.aspectId === a.id); return { a, e: its.reduce((s, i) => s + (Number(i.estimate) || 0), 0), sp: its.reduce((s, i) => s + (Number(i.actualSpent) || 0), 0) }; }).filter(x => x.e || x.sp);
    body = `<div class="money-sum"><div><span class="small muted">Overall budget</span><b class="num">${budget ? inr(budget) : 'Not set'}</b></div><div><span class="small muted">Spent so far</span><b class="num">${inr(spent)}</b></div>
        <div><span class="small muted">${budget && spent > budget ? 'Over budget' : 'Budget left'}</span><b class="num" style="${budget && spent > budget ? 'color:var(--late)' : ''}">${budget ? inr(Math.abs(budget - spent)) : '–'}</b></div><div><span class="small muted">Estimated total</span><b class="num">${inr(est)}</b></div></div>

      ${can.members() ? `<div id="bf" class="row-actions" style="margin:16px 0;align-items:flex-end"><label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500">Overall budget (₹)<input class="field num" type="number" min="0" step="1000" id="b_amt" value="${budget || ''}" placeholder="e.g. 1500000"></label><button class="btn primary" type="button" id="b_save">Save budget</button><span class="small muted" id="b_msg"></span></div>` : '<p class="small muted">Only the Owner can change the budget.</p>'}
      <div class="sub-h" style="margin-top:12px">By aspect</div>
      ${byAspect.length ? `<div class="tbl-wrap"><table><thead><tr><th>Aspect</th><th class="num">Estimated</th><th class="num">Spent</th></tr></thead><tbody>${byAspect.map(x => `<tr><td>${esc(x.a.name)}</td><td class="num">${inr(x.e)}</td><td class="num">${inr(x.sp)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">No amounts entered on any item yet.</p>'}`;
  } else {
    const rs = rowsFor(key), total = kind === 'spent' ? spent : est;
    body = `<p class="small muted" style="margin-top:0">${rs.length ? `${rs.length} item${rs.length === 1 ? '' : 's'} add up to <b>${inr(total)}</b>. Tap an item to correct or clear its amount.` : `No item has ${kind === 'spent' ? 'an Actual spent' : 'an Estimate'} amount yet. Open any item to add one.`}</p>

  }
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><div class="dlg-head"><h2>${title}</h2><button class="btn" type="button" data-close>← Back</button></div><div class="dlg-body">${body}</div></form>`;
  dlg.showModal();

  const bsave = $('#b_save');
  if (bsave) $('#b_amt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); bsave.click(); } };
  if (bsave) bsave.onclick = async () => {
    const v = Number($('#b_amt').value) || 0;
    try { await store.saveSettings({ budget: v }); toast(v ? 'Budget saved' : 'Budget cleared'); moneyDialog('budget'); if (currentView() === 'dashboard') render(); }

    list.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => showPhoto(photoCache.find(p => p.id === b.dataset.ph), () => draw()));
  };
  [['pf_aspect', 'aspect'], ['pf_floor', 'floor'], ['pf_kind', 'kind']].forEach(([id, k]) => $('#' + id, main).onchange = e => { f[k] = e.target.value; lsSet('reno-photo-filters', f); draw(); });
  $('#phAddBtn', main).onclick = () => { const s = $('#phAdd', main); s.hidden = !s.hidden; if (!s.hidden) $('#pu_aspect', main).focus(); };
  $('#pu_aspect', main).onchange = e => {
    const its = state.items.filter(i => i.aspectId === e.target.value).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.title.localeCompare(b.title));
    const sel = $('#pu_item', main); sel.disabled = !its.length;
    sel.innerHTML = its.length ? its.map(i => opt(i.id, i.title, '')).join('') : '<option value="">No items in this aspect</option>';
  };
  $('#pu_file', main).onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const itemId = $('#pu_item', main).value, kind = $('#pu_kind', main).value, msg = $('#pu_msg', main);
    if (!itemId) { msg.textContent = 'Choose the aspect and item first.'; return; }
    if (!files.length) return;
    let ok = 0; msg.textContent = 'Uploading…';
    for (const file of files) { try { const data = await shrink(file); await store.addPhoto({ itemId, kind, data, by: state.user.email }); ok++; } catch (err) { console.error(err); } }
    refreshThumb(itemId);
    msg.textContent = ok === files.length ? `${ok} photo${ok === 1 ? '' : 's'} added.` : `${ok} of ${files.length} photos added. The rest could not be uploaded.`;
    await loadAll(); draw();
  };
  const loadAll = async () => { try { photoCache = await store.allPhotos(); backfillThumbs(photoCache); } catch (err) { console.error(err); photoCache = []; list.innerHTML = '<p class="muted" style="margin-top:24px">Photos could not be loaded. Check your connection and refresh.</p>'; return; } };
  if (photoCache) draw();
  await loadAll(); if (currentView() === 'photos' && document.body.contains(list)) draw();
}
function showPhoto(p, after) {
  if (!p) return;
  const it = state.items.find(i => i.id === p.itemId) || {};
  const dlg = $('#dlg');
  const canDel = can.editAll() || p.by === state.user.email;
  dlg.innerHTML = `<form method="dialog"><div class="dlg-head"><div><div class="small muted">${esc(aspectName(it.aspectId))}${photoFloor(p) ? ' · ' + esc(photoFloor(p)) : ''}</div><h2>${esc(it.title || 'Photo')}</h2>
      <div class="small muted"><span class="ph-kind ${p.kind === 'after' ? 'after' : 'before'}">${p.kind === 'after' ? 'After' : 'Before'}</span> ${esc(memberName(p.by))} · ${phWhen(p.at)}</div></div>
      <button class="btn" type="button" data-close>← Back</button></div>
    <div class="dlg-body"><img class="ph-big" src="${esc(p.data)}" alt="${esc(p.kind)} photo of ${esc(it.title || '')}">
      <div class="row-actions"><button class="btn primary" type="button" id="ph_open">Open item</button>${canDel ? '<button class="btn danger" type="button" id="ph_del">Delete photo</button>' : ''}<span class="small muted" id="ph_msg"></span></div></div></form>`;
  dlg.showModal();
  $('#ph_open').onclick = () => { dlg.close(); openItem(p.itemId); };
  const del = $('#ph_del');
  if (del) del.onclick = async () => {
    if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = 'Yes, delete'; $('#ph_msg').textContent = 'This photo will be deleted permanently.'; return; }
    try { await store.deletePhoto(p.id); photoCache = (photoCache || []).filter(x => x.id !== p.id); dlg.close(); toast('Photo deleted'); refreshThumb(p.itemId, photoCache.filter(x => x.itemId === p.itemId)); after && after(); }
    catch (err) { console.error(err); $('#ph_msg').textContent = 'Could not delete this photo.'; }
  };
}
/* ---------- item thumbnails ---------- */
// Redraw for new thumbnails, but never under someone filling in the Photos page form
function thumbsChanged() { if (state.ready && currentView() !== 'photos') render(); }
const anyThumbs = () => !!state.thumbs && Object.keys(state.thumbs).length > 0;
// slot: keep an empty space of the same size when the item has no photo, so rows stay aligned
const th = (id, cls = '', slot = true) => { const d = state.thumbs && state.thumbs[id];
  if (d) return `<img class="ithumb ${cls}" src="${esc(d)}" alt="Photo" loading="lazy" decoding="async">`;
  return slot && anyThumbs() ? `<span class="ithumb ${cls} none" aria-hidden="true"></span>` : ''; };
function backfillThumbs(all) {
  if (store.mode !== 'live' || !state.thumbsOk) return;
  const by = {}; all.forEach(p => (by[p.itemId] = by[p.itemId] || []).push(p));
  Object.entries(by).forEach(([id, ps]) => { if (!state.thumbMeta || !state.thumbMeta[id]) refreshThumb(id, ps); });
}
function makeThumb(dataUrl) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const n = 96, c = document.createElement('canvas'); c.width = c.height = n;
    const s = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
    res(c.toDataURL('image/jpeg', 0.7)); }; img.onerror = () => res(''); img.src = dataUrl; });
}
// Keep an item's thumbnail in step with its newest photo
async function refreshThumb(itemId, known) {
  if (store.mode !== 'live' || state.thumbsOk === false) return;
  try {
    const ps = known || await store.photos(itemId);
    const latest = [...ps].sort((a, b) => b.at - a.at)[0];
    if (!latest) { if (state.thumbs && state.thumbs[itemId]) await store.clearThumb(itemId); return; }
    if (state.thumbMeta && state.thumbMeta[itemId] === latest.id) return;
    const t = await makeThumb(latest.data); if (t) await store.setThumb(itemId, t, latest.id);
  } catch (e) { console.warn('Thumbnail not saved', e.code || e); }
}
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      let max = 1280, q = 0.72, out = '';
      for (let n = 0; n < 6; n++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 300000) break;
        max *= 0.8; q = Math.max(0.5, q - 0.06);
      }
      res(out);
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

// Back / Cancel / Close buttons and tapping outside the box always close it (no form checks)
const dlgEl = $('#dlg');
dlgEl.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === dlgEl) dlgEl.close(); });

boot();
})();
</script>
